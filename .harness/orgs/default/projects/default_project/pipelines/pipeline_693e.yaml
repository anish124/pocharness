pipeline:
  stages:
    - steps:
        - run:
            script: echo "hello world"
    - id: javaMavenBuildTestHostedLinuxStage_1
      name: Java Maven Build and Test on Harness Cloud (Linux)
      clone:
        enabled: true
      cache:
        enabled: true
      build-intelligence:
        enabled: true
      steps:
        - id: setupJava
          name: Setup Java
          template:
            uses: setupJava@1.0.0
            with:
              version: "21"
              distribution: corretto
        - id: buildLinux
          name: Build on Linux
          run:
            shell: bash
            script: |-
              JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v java)")")")"
              export JAVA_HOME
              export PATH="$JAVA_HOME/bin:$PATH"
              java -version
              mvn -version
              mvn -B -DskipTests -Dmaven.build.cache.skipCache=true package
        - id: testLinux
          name: Test on Linux
          run-test:
            shell: bash
            script: |-
              set -eu
              JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v java)")")")"
              export JAVA_HOME
              export PATH="$JAVA_HOME/bin:$PATH"
              java -version
              mvn -version
              mvn -B test -Dmaven.build.cache.skipCache=true
            intelligence:
              disabled: true
